<svg xmlns="http://www.w3.org/2000/svg" width="880" height="150" viewBox="0 0 880 150" fill="none" role="img" aria-label="Let us build something together">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#000000"/><stop offset="60%" stop-color="#000000"/><stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#9a9a9a"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/><stop offset="100%" stop-color="#ffffff" stop-opacity="0.014"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/><stop offset="50%" stop-color="#ffffff" stop-opacity="0.09"/><stop offset="100%" stop-color="#9a9a9a" stop-opacity="0.5"/>
    </linearGradient>
    <radialGradient id="gA" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#ffffff" stop-opacity="0.2"/><stop offset="100%" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
    <radialGradient id="gB" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#9a9a9a" stop-opacity="0.24"/><stop offset="100%" stop-color="#9a9a9a" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#7a7a7a" stroke-opacity="0.045"/></pattern>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/><stop offset="50%" stop-color="#ffffff" stop-opacity="0.12"/><stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><rect width="880" height="150" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="880" height="150" fill="url(#bg)"/>
    <rect width="880" height="150" fill="url(#grid)"/>
    <ellipse cx="440" cy="150" rx="420" ry="120" fill="url(#gA)"/>
    <ellipse cx="120" cy="0" rx="280" ry="110" fill="url(#gB)"/>
    <rect x="-220" y="0" width="200" height="150" fill="url(#sweep)">
      <animate attributeName="x" values="-220;900" dur="6s" repeatCount="indefinite"/>
    </rect>
    <g font-family="&apos;JetBrains Mono&apos;,&apos;Fira Code&apos;,&apos;IBM Plex Mono&apos;,&apos;Cascadia Mono&apos;,&apos;SF Mono&apos;,ui-monospace,SFMono-Regular,Menlo,Consolas,&apos;DejaVu Sans Mono&apos;,&apos;Courier New&apos;,monospace" text-anchor="middle">
      <text x="440" y="58" font-size="27" font-weight="700" fill="url(#neon)" letter-spacing="1.2">Let's build something together</text>
      <text x="440" y="84" font-size="11" fill="#6e6e6e" letter-spacing="1.4">OPEN TO COLLABORATIONS · INTERNSHIPS · HACKATHON TEAMS</text>
      <g transform="translate(440,104)">
        <rect x="-154" width="308" height="26" rx="13" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.36"/>
        <circle cx="-136" cy="13" r="4" fill="#ffffff"><animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite"/></circle>
        <circle cx="-136" cy="13" r="4" fill="none" stroke="#ffffff">
          <animate attributeName="r" values="4;12" dur="1.8s" repeatCount="indefinite"/>
          <animate attributeName="stroke-opacity" values="0.8;0" dur="1.8s" repeatCount="indefinite"/>
        </circle>
        <text x="-124" y="17" text-anchor="start" font-size="10" fill="#e5e5e5" letter-spacing="1.1">CHANNELS OPEN — RESPONSE TIME &lt; 24H</text>
      </g>
    </g>
    <rect x="0.5" y="0.5" width="879" height="149" rx="20" fill="none" stroke="url(#edge)" stroke-width="1"/>
  </g>
</svg>