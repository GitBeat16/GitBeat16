      <text x="48" y="108" font-size="10.5" fill="#6e6e6e" letter-spacing="0.6">Pune Institute of Computer Technology (PICT) · SPPU · Second Year (SE)</text>

      <text x="48" y="134" font-size="9" fill="#4d4d4d" letter-spacing="2.4">FOCUS AREAS</text>

      <g font-size="10.5">
        <g opacity="1">
