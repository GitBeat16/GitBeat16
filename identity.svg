          <rect x="48" y="144" width="180" height="24" rx="12" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.35"/>
          <circle cx="62" cy="156" r="3" fill="#ffffff"/>
          <text x="72" y="160" fill="#e5e5e5">Artificial Intelligence</text>
        </g>
        <g opacity="1">
          <animate attributeName="opacity" values="0.5;1" dur="0.7s" begin="0.5s" fill="freeze"/>
          <rect x="236" y="144" width="182" height="24" rx="12" fill="#9a9a9a" fill-opacity="0.07" stroke="#9a9a9a" stroke-opacity="0.35"/>
          <circle cx="250" cy="156" r="3" fill="#9a9a9a"/>
          <text x="260" y="160" fill="#d4d4d4">Full Stack Development</text>
        </g>
        <g opacity="1">
          <animate attributeName="opacity" values="0.5;1" dur="0.7s" begin="0.8s" fill="freeze"/>
          <rect x="48" y="176" width="122" height="24" rx="12" fill="#9a9a9a" fill-opacity="0.07" stroke="#9a9a9a" stroke-opacity="0.35"/>
          <circle cx="62" cy="188" r="3" fill="#9a9a9a"/>
          <text x="72" y="192" fill="#d4d4d4">Generative AI</text>
        </g>
        <g opacity="1">
          <animate attributeName="opacity" values="0.5;1" dur="0.7s" begin="1.1s" fill="freeze"/>
          <rect x="178" y="176" width="136" height="24" rx="12" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.35"/>
          <circle cx="192" cy="188" r="3" fill="#ffffff"/>
          <text x="202" y="192" fill="#e5e5e5">Developer Tools</text>
        </g>
        <g opacity="1">
          <animate attributeName="opacity" values="0.5;1" dur="0.7s" begin="1.4s" fill="freeze"/>
          <rect x="322" y="176" width="136" height="24" rx="12" fill="#c9c9c9" fill-opacity="0.06" stroke="#c9c9c9" stroke-opacity="0.3"/>
          <circle cx="336" cy="188" r="3" fill="#c9c9c9"/>
          <text x="346" y="192" fill="#d4d4d4">Agentic Systems</text>
        </g>
