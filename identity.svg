<svg xmlns="http://www.w3.org/2000/svg" width="880" height="248" viewBox="0 0 880 248" fill="none" role="img" aria-label="Identity card - Computer Engineering student at PICT, CGPA 9.41, MHT-CET 99.34 percentile">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#000000"/><stop offset="60%" stop-color="#000000"/><stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#9a9a9a"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/><stop offset="100%" stop-color="#ffffff" stop-opacity="0.014"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/><stop offset="50%" stop-color="#ffffff" stop-opacity="0.09"/><stop offset="100%" stop-color="#9a9a9a" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/><stop offset="50%" stop-color="#ffffff" stop-opacity="0.10"/><stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#ffffff" stop-opacity="0.2"/><stop offset="100%" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#9a9a9a" stop-opacity="0.24"/><stop offset="100%" stop-color="#9a9a9a" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#7a7a7a" stroke-opacity="0.045"/></pattern>
    <clipPath id="frame"><rect width="880" height="248" rx="20"/></clipPath>
    <clipPath id="cardclip"><rect x="24" y="54" width="832" height="170" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="880" height="248" fill="url(#bg)"/>
    <rect width="880" height="248" fill="url(#grid)"/>
    <ellipse cx="60" cy="40" rx="240" ry="130" fill="url(#glowA)"/>
    <ellipse cx="820" cy="230" rx="240" ry="140" fill="url(#glowB)"/>

    <g font-family="&apos;JetBrains Mono&apos;,&apos;Fira Code&apos;,&apos;IBM Plex Mono&apos;,&apos;Cascadia Mono&apos;,&apos;SF Mono&apos;,ui-monospace,SFMono-Regular,Menlo,Consolas,&apos;DejaVu Sans Mono&apos;,&apos;Courier New&apos;,monospace">
      <text x="28" y="32" font-size="16" font-weight="700" fill="url(#neon)" letter-spacing="3.2">IDENTITY MODULE</text>
      <text x="28" y="46" font-size="10" fill="#4d4d4d" letter-spacing="1.6">PROFILE LOADED — CLEARANCE: BUILDER</text>
    </g>

    <rect x="24" y="54" width="832" height="170" rx="16" fill="url(#glass)"/>
    <rect x="24" y="54" width="832" height="170" rx="16" fill="none" stroke="url(#edge)" stroke-width="1.1"/>
    <g clip-path="url(#cardclip)">
