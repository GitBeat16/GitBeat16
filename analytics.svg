        <text x="712" y="46" font-size="8.5" fill="#4d4d4d" letter-spacing="1.6">BEST DAY</text>
        <text x="712" y="82" font-size="26" font-weight="700" fill="#ffffff" letter-spacing="0.5">89</text>
