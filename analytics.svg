        <text x="544" y="46" font-size="8.5" fill="#4d4d4d" letter-spacing="1.6">ACTIVE DAYS</text>
        <text x="544" y="82" font-size="26" font-weight="700" fill="#ffffff" letter-spacing="0.5">38</text>
