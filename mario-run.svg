<svg viewBox="0 0 1000 170" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5C94FC"/>
      <stop offset="100%" stop-color="#9AD0FF"/>
    </linearGradient>
    <pattern id="bricks2" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#C84C0C"/>
      <rect width="40" height="18" fill="#E0651C"/>
      <rect width="40" height="40" fill="none" stroke="#7A2E00" stroke-width="2"/>
      <line x1="20" y1="0" x2="20" y2="18" stroke="#7A2E00" stroke-width="2"/>
      <line x1="0" y1="20" x2="40" y2="20" stroke="#7A2E00" stroke-width="2"/>
      <line x1="20" y1="20" x2="20" y2="40" stroke="#7A2E00" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="1000" height="170" fill="url(#sky2)"/>

  <!-- drifting clouds, two tiles for a seamless loop -->
  <g fill="#FFFFFF">
    <g transform="translate(0,0)">
      <g transform="translate(80,30)"><ellipse cx="0" cy="12" rx="24" ry="11"/><ellipse cx="22" cy="6" rx="18" ry="13"/><ellipse cx="-18" cy="8" rx="16" ry="10"/></g>
      <g transform="translate(430,20)"><ellipse cx="0" cy="12" rx="26" ry="12"/><ellipse cx="24" cy="6" rx="18" ry="13"/><ellipse cx="-20" cy="8" rx="16" ry="10"/></g>
      <g transform="translate(800,35)"><ellipse cx="0" cy="12" rx="20" ry="10"/><ellipse cx="18" cy="6" rx="15" ry="11"/><ellipse cx="-16" cy="8" rx="14" ry="9"/></g>
      <animateTransform attributeName="transform" type="translate" values="0,0; -1000,0" dur="40s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(1000,0)">
      <g transform="translate(80,30)"><ellipse cx="0" cy="12" rx="24" ry="11"/><ellipse cx="22" cy="6" rx="18" ry="13"/><ellipse cx="-18" cy="8" rx="16" ry="10"/></g>
      <g transform="translate(430,20)"><ellipse cx="0" cy="12" rx="26" ry="12"/><ellipse cx="24" cy="6" rx="18" ry="13"/><ellipse cx="-20" cy="8" rx="16" ry="10"/></g>
      <g transform="translate(800,35)"><ellipse cx="0" cy="12" rx="20" ry="10"/><ellipse cx="18" cy="6" rx="15" ry="11"/><ellipse cx="-16" cy="8" rx="14" ry="9"/></g>
      <animateTransform attributeName="transform" type="translate" values="1000,0; 0,0" dur="40s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- question blocks -->
  <g font-family="Arial Black, Arial, sans-serif" font-weight="900">
    <g transform="translate(220,60)">
      <rect width="30" height="30" fill="#FBD000" stroke="#8A5A00" stroke-width="3"/>
      <text x="15" y="22" text-anchor="middle" font-size="18" fill="#8A5A00">?</text>
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0,0; 0,-6; 0,0" dur="1.1s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(650,55)">
      <rect width="30" height="30" fill="#FBD000" stroke="#8A5A00" stroke-width="3"/>
      <text x="15" y="22" text-anchor="middle" font-size="18" fill="#8A5A00">?</text>
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0,0; 0,-6; 0,0" dur="1.3s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- pipe -->
  <g transform="translate(880,72)">
    <rect x="-6" y="10" width="60" height="22" fill="#00A800" stroke="#004D00" stroke-width="3"/>
    <rect x="4" y="32" width="40" height="38" fill="#00C800" stroke="#004D00" stroke-width="3"/>
  </g>

  <!-- ground -->
  <rect x="0" y="120" width="1000" height="50" fill="url(#bricks2)"/>

  <!-- running Mario, travels the full width and loops -->
  <g id="runner">
    <animateTransform attributeName="transform" type="translate" values="-60,0; 1040,0" dur="5s" repeatCount="indefinite"/>

    <g transform="translate(0,90)">
      <!-- gentle running bob -->
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0,0; 0,-5; 0,0; 0,-5; 0,0" dur="0.4s" repeatCount="indefinite"/>

      <!-- back leg -->
      <g transform="translate(-6,26)">
        <rect x="-5" y="0" width="11" height="20" fill="#6B3A1A" stroke="#3A1E0C" stroke-width="2"/>
        <rect x="-8" y="18" width="16" height="8" fill="#3A1E0C"/>
        <animateTransform attributeName="transform" type="rotate" values="30 -6 26; -30 -6 26; 30 -6 26" dur="0.4s" repeatCount="indefinite"/>
      </g>

      <!-- front leg -->
      <g transform="translate(6,26)">
        <rect x="-5" y="0" width="11" height="20" fill="#6B3A1A" stroke="#3A1E0C" stroke-width="2"/>
        <rect x="-8" y="18" width="16" height="8" fill="#3A1E0C"/>
        <animateTransform attributeName="transform" type="rotate" values="-30 6 26; 30 6 26; -30 6 26" dur="0.4s" repeatCount="indefinite"/>
      </g>

      <!-- torso: overalls -->
      <rect x="-11" y="10" width="22" height="18" fill="#049CD8" stroke="#023A57" stroke-width="2"/>
      <circle cx="-6" cy="16" r="2" fill="#FBD000"/>
      <circle cx="6" cy="16" r="2" fill="#FBD000"/>

      <!-- shirt sleeves / arms -->
      <rect x="-16" y="8" width="8" height="14" fill="#E52521" stroke="#7A0000" stroke-width="2"/>
      <rect x="8" y="8" width="8" height="14" fill="#E52521" stroke="#7A0000" stroke-width="2"/>
      <circle cx="-14" cy="22" r="4" fill="#F5C6A0"/>
      <circle cx="14" cy="22" r="4" fill="#F5C6A0"/>

      <!-- shirt -->
      <rect x="-11" y="2" width="22" height="10" fill="#E52521" stroke="#7A0000" stroke-width="2"/>

      <!-- head -->
      <circle cx="0" cy="-8" r="11" fill="#F5C6A0" stroke="#B98354" stroke-width="1.5"/>
      <rect x="-3" y="-4" width="8" height="3" fill="#3A1E0C"/>
      <path d="M -11 -10 Q 0 -22 11 -10 L 11 -13 Q 0 -20 -11 -13 Z" fill="#E52521" stroke="#7A0000" stroke-width="2"/>
      <circle cx="9" cy="-11" r="4" fill="#E52521" stroke="#7A0000" stroke-width="2"/>
    </g>
  </g>
</svg>
