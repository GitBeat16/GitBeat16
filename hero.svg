<svg xmlns="http://www.w3.org/2000/svg" width="880" height="320" viewBox="0 0 880 320" fill="none" role="img" aria-label="Srushti Kalokhe - Computer Engineering Student, AI and Full Stack Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="55%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9a9a9a" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#9a9a9a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#c9c9c9"/>
      <stop offset="100%" stop-color="#9a9a9a"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.075"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.015"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#9a9a9a" stop-opacity="0.55"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#7a7a7a" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="tight" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <clipPath id="frame"><rect width="880" height="320" rx="20"/></clipPath>

    <mask id="m1"><rect x="54" y="105" width="0" height="16" fill="#fff"><animate attributeName="width" values="0;0;70;70;70;0" keyTimes="0;0.02;0.085;0.97;0.99;1" dur="17s" repeatCount="indefinite"/></rect></mask>
    <mask id="m2"><rect x="54" y="126" width="0" height="26" fill="#fff"><animate attributeName="width" values="0;0;206;206;206;0" keyTimes="0;0.10;0.19;0.97;0.99;1" dur="17s" repeatCount="indefinite"/></rect></mask>
    <mask id="m3"><rect x="54" y="158" width="0" height="16" fill="#fff"><animate attributeName="width" values="0;0;118;118;118;0" keyTimes="0;0.22;0.30;0.97;0.99;1" dur="17s" repeatCount="indefinite"/></rect></mask>
    <mask id="m4"><rect x="54" y="180" width="0" height="16" fill="#fff"><animate attributeName="width" values="0;0;464;464;464;0" keyTimes="0;0.32;0.47;0.97;0.99;1" dur="17s" repeatCount="indefinite"/></rect></mask>
    <mask id="m5"><rect x="54" y="206" width="0" height="16" fill="#fff"><animate attributeName="width" values="0;0;142;142;142;0" keyTimes="0;0.50;0.58;0.97;0.99;1" dur="17s" repeatCount="indefinite"/></rect></mask>
    <mask id="m6"><rect x="54" y="228" width="0" height="18" fill="#fff"><animate attributeName="width" values="0;0;382;382;382;0" keyTimes="0;0.60;0.75;0.97;0.99;1" dur="17s" repeatCount="indefinite"/></rect></mask>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="880" height="320" fill="url(#bg)"/>
    <rect width="880" height="320" fill="url(#grid)"/>
    <ellipse cx="120" cy="40" rx="260" ry="150" fill="url(#glowA)"/>
    <ellipse cx="760" cy="280" rx="280" ry="170" fill="url(#glowB)"/>

    <!-- drifting scanline -->
    <rect x="0" y="-40" width="880" height="40" fill="#ffffff" opacity="0.05">
      <animate attributeName="y" values="-40;320" dur="7s" repeatCount="indefinite"/>
    </rect>

    <!-- terminal -->
    <g>
      <rect x="34" y="60" width="520" height="206" rx="16" fill="url(#glass)"/>
      <rect x="34" y="60" width="520" height="206" rx="16" fill="none" stroke="url(#edge)" stroke-width="1.2"/>
      <path d="M34 90h520" stroke="#ffffff" stroke-opacity="0.08"/>
      <circle cx="56" cy="75" r="4.5" fill="#3a3a3a"/>
      <circle cx="72" cy="75" r="4.5" fill="#4a4a4a"/>
      <circle cx="88" cy="75" r="4.5" fill="#5a5a5a"/>
      <text x="118" y="79" font-family="&apos;JetBrains Mono&apos;,&apos;Fira Code&apos;,&apos;IBM Plex Mono&apos;,&apos;Cascadia Mono&apos;,&apos;SF Mono&apos;,ui-monospace,SFMono-Regular,Menlo,Consolas,&apos;DejaVu Sans Mono&apos;,&apos;Courier New&apos;,monospace" font-size="11" fill="#6e6e6e" letter-spacing="1.4">srushti@dev-command-center — zsh</text>
      <circle cx="530" cy="75" r="3" fill="#ffffff"><animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/></circle>

      <g font-family="&apos;JetBrains Mono&apos;,&apos;Fira Code&apos;,&apos;IBM Plex Mono&apos;,&apos;Cascadia Mono&apos;,&apos;SF Mono&apos;,ui-monospace,SFMono-Regular,Menlo,Consolas,&apos;DejaVu Sans Mono&apos;,&apos;Courier New&apos;,monospace">
        <g mask="url(#m1)"><text x="56" y="118" font-size="12.5" fill="#a0a0a0"><tspan fill="#9a9a9a">$</tspan> whoami</text></g>
        <g mask="url(#m2)"><text x="56" y="146" font-size="21" font-weight="700" fill="url(#neon)" letter-spacing="0.4">Srushti Kalokhe</text></g>
        <g mask="url(#m3)"><text x="56" y="171" font-size="12.5" fill="#a0a0a0"><tspan fill="#9a9a9a">$</tspan> cat role.txt</text></g>
        <g mask="url(#m4)"><text x="56" y="193" font-size="12.5" fill="#c9c9c9">Computer Engineering Student · AI/ML + Full Stack Enthusiast</text></g>
        <g mask="url(#m5)"><text x="56" y="219" font-size="12.5" fill="#a0a0a0"><tspan fill="#9a9a9a">$</tspan> ./status --live</text></g>
        <g mask="url(#m6)"><text x="56" y="242" font-size="12.5" fill="#ffffff">Learning in public · building AI-powered projects</text></g>
      </g>

      <!-- travelling caret -->
      <rect y="107" width="8" height="14" fill="#ffffff" opacity="0.9">
        <animate attributeName="x" values="56;56;126;56;262;56;174;56;520;56;198;56;438;438;56" keyTimes="0;0.02;0.085;0.10;0.19;0.22;0.30;0.32;0.47;0.50;0.58;0.60;0.75;0.99;1" dur="17s" repeatCount="indefinite"/>
        <animate attributeName="y" values="107;107;131;131;160;160;181;181;208;208;231;231;107" keyTimes="0;0.085;0.10;0.19;0.22;0.30;0.32;0.47;0.50;0.58;0.60;0.99;1" dur="17s" repeatCount="indefinite"/>
        <animate attributeName="height" values="14;14;20;20;14;14;14;14;14;14;14;14;14" keyTimes="0;0.085;0.10;0.19;0.22;0.30;0.32;0.47;0.50;0.58;0.60;0.99;1" dur="17s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.95;0.1;0.95" dur="1.05s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- avatar core -->
    <g transform="translate(706,140)">
      <circle r="74" fill="url(#glowA)" opacity="0.7"/>
      <g opacity="0.85">
        <circle r="62" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="4 10">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
        </circle>
        <circle r="52" fill="none" stroke="#9a9a9a" stroke-opacity="0.4" stroke-width="1" stroke-dasharray="18 8">
          <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="24s" repeatCount="indefinite"/>
        </circle>
      </g>
      <circle r="44" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.5">
        <animate attributeName="r" values="44;66;44" dur="3.4s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.5;0;0.5" dur="3.4s" repeatCount="indefinite"/>
      </circle>
      <path d="M0 -42 36.4 -21 36.4 21 0 42 -36.4 21 -36.4 -21Z" fill="#000000" stroke="url(#neon)" stroke-width="1.6"/>
      <path d="M0 -42 36.4 -21 36.4 21 0 42 -36.4 21 -36.4 -21Z" fill="none" stroke="#ffffff" stroke-width="1.6" filter="url(#tight)" opacity="0.55"/>
      <text x="0" y="9" text-anchor="middle" font-family="&apos;JetBrains Mono&apos;,&apos;Fira Code&apos;,&apos;IBM Plex Mono&apos;,&apos;Cascadia Mono&apos;,&apos;SF Mono&apos;,ui-monospace,SFMono-Regular,Menlo,Consolas,&apos;DejaVu Sans Mono&apos;,&apos;Courier New&apos;,monospace" font-size="26" font-weight="700" fill="url(#neon)" letter-spacing="1">SK</text>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="11s" repeatCount="indefinite"/>
        <circle cx="62" cy="0" r="3.2" fill="#ffffff"/>
        <circle cx="-62" cy="0" r="2.4" fill="#9a9a9a"/>
        <circle cx="0" cy="58" r="2" fill="#c9c9c9"/>
      </g>
    </g>

    <!-- floating code chips -->
    <g font-family="&apos;JetBrains Mono&apos;,&apos;Fira Code&apos;,&apos;IBM Plex Mono&apos;,&apos;Cascadia Mono&apos;,&apos;SF Mono&apos;,ui-monospace,SFMono-Regular,Menlo,Consolas,&apos;DejaVu Sans Mono&apos;,&apos;Courier New&apos;,monospace" font-size="10">
      <g opacity="0.9">
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -9;0 0" dur="5.5s" repeatCount="indefinite"/>
        <rect x="586" y="34" width="176" height="24" rx="8" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.28"/>
        <text x="598" y="50" fill="#7a7a7a">const<tspan fill="#6e6e6e"> role </tspan><tspan fill="#9a9a9a">=</tspan><tspan fill="#ffffff"> "AI + FS"</tspan></text>
      </g>
      <g opacity="0.9">
        <animateTransform attributeName="transform" type="translate" values="0 0;0 8;0 0" dur="6.8s" repeatCount="indefinite"/>
        <rect x="794" y="112" width="66" height="24" rx="8" fill="url(#glass)" stroke="#9a9a9a" stroke-opacity="0.32"/>
        <text x="805" y="128" fill="#9a9a9a">&lt;AI /&gt;</text>
      </g>
      <g opacity="0.9">
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="7.6s" repeatCount="indefinite"/>
        <rect x="576" y="238" width="196" height="24" rx="8" fill="url(#glass)" stroke="#c9c9c9" stroke-opacity="0.28"/>
        <text x="588" y="254" fill="#a0a0a0">@app.get(<tspan fill="#ffffff">"/build"</tspan>)</text>
      </g>
      <g opacity="0.85">
        <animateTransform attributeName="transform" type="translate" values="0 0;0 7;0 0" dur="6.1s" repeatCount="indefinite"/>
        <rect x="30" y="282" width="212" height="24" rx="8" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.22"/>
        <text x="42" y="298" fill="#6e6e6e">git commit -m <tspan fill="#ffffff">"ship it"</tspan></text>
      </g>
    </g>


    <rect x="0.5" y="0.5" width="879" height="319" rx="20" fill="none" stroke="url(#edge)" stroke-width="1"/>
  </g>
</svg>
