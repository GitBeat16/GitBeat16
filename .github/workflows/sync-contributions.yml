name: Regenerate README assets

# Re-exports readme/*.svg whenever the profile data, theme or generator
# changes, and commits the result if anything differs.

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'shared/**'
      - 'scripts/**'
      - '.github/workflows/sync-contributions.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-assets
  cancel-in-progress: true

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate README assets
        run: node scripts/generate-readme-assets.mjs

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain readme)" ]; then
            git add readme
            git commit -m "chore: regenerate README assets [skip ci]"
            git push
          else
            echo "no changes"
          fi
