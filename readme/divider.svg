<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 880 46" width="880" height="46" role="img" aria-label="Web strand divider with a small spider crawling along it" preserveAspectRatio="xMidYMid meet">
<title>Web strand divider with a small spider crawling along it</title>
<defs>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="0.4" y2="1">
    <stop offset="0" stop-color="#0C0F1B"/>
    <stop offset="0.55" stop-color="#0B0D16"/>
    <stop offset="1" stop-color="#06070E"/>
  </linearGradient>
  <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#E0475A"/>
    <stop offset="1" stop-color="#B5303F"/>
  </linearGradient>
  <linearGradient id="navyGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#4C63B6"/>
    <stop offset="1" stop-color="#172143"/>
  </linearGradient>
  <linearGradient id="edgeGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#B5303F" stop-opacity="0.9"/>
    <stop offset="0.5" stop-color="#33406B" stop-opacity="0.55"/>
    <stop offset="1" stop-color="#172143" stop-opacity="0.9"/>
  </linearGradient>
  <pattern id="halftone" width="6" height="6" patternUnits="userSpaceOnUse">
    <circle cx="1.5" cy="1.5" r="0.75" fill="#FFFFFF" fill-opacity="0.035"/>
    <circle cx="4.5" cy="4.5" r="0.75" fill="#FFFFFF" fill-opacity="0.02"/>
  </pattern>
  <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="3.2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="tinyGlow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="1.6" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter></defs>
<style>
  text{font-family:'Segoe UI', 'Helvetica Neue', 'DejaVu Sans', Arial, sans-serif;dominant-baseline:middle}
  .d{font-family:'Trebuchet MS', 'Verdana', 'DejaVu Sans', sans-serif;font-weight:700;letter-spacing:0.5px}
  .mono{font-family:'SFMono-Regular', 'DejaVu Sans Mono', Menlo, Consolas, monospace}
  .t{fill:#ECE7E4}
  .dim{fill:#9AA3BE}
  .faint{fill:#5C6684}
  .red{fill:#E0475A}
  @media (prefers-reduced-motion: reduce){*{animation:none !important}}
  @keyframes crawl{0%{transform:translateX(0)}50%{transform:translateX(740px)}100%{transform:translateX(0)}}
  @keyframes legTwitch{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.6px)}}
  .crawler{animation:crawl 30s ease-in-out infinite}
  .twitch{transform-box:fill-box;transform-origin:50% 30%;animation:legTwitch .62s ease-in-out infinite}
  .bob{transform-box:fill-box;animation:bob .62s ease-in-out infinite}
  @keyframes shimmer{0%,100%{opacity:.5}50%{opacity:.9}}
  .thread{animation:shimmer 5s ease-in-out infinite}
  </style>
  <path class="thread" d="M0 23 H880" stroke="#232B47" stroke-width="1.2" fill="none"/>
  <path class="thread" d="M40 23Q68 30 96 23M96 23Q124 30 152 23M152 23Q180 30 208 23M208 23Q236 30 264 23M264 23Q292 30 320 23M320 23Q348 30 376 23M376 23Q404 30 432 23M432 23Q460 30 488 23M488 23Q516 30 544 23M544 23Q572 30 600 23M600 23Q628 30 656 23M656 23Q684 30 712 23M712 23Q740 30 768 23M768 23Q796 30 824 23M824 23Q852 30 880 23" stroke="#33406B" stroke-width="1" fill="none" opacity="0.7"/>
  <circle cx="6" cy="23" r="3" fill="#B5303F"/>
  <circle cx="874" cy="23" r="3" fill="#4C63B6"/>
  <g class="crawler">
    <g transform="translate(70 23) scale(0.86)">
      <g class="bob"><g class="twitch"><g class="spider-mark">
    <path d="M-2.4 -1.5L-9.94 -7.95L-16 -9.24" fill="none" stroke="#9AA3BE" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M2.4 -1.5L9.94 -7.95L16 -9.24" fill="none" stroke="#9AA3BE" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M-2.4 -1.5L-10.7 -4.77L-16 -3.95" fill="none" stroke="#9AA3BE" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M2.4 -1.5L10.7 -4.77L16 -3.95" fill="none" stroke="#9AA3BE" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M-2.4 -1.5L-10.99 -0.94L-16 2.43" fill="none" stroke="#9AA3BE" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M2.4 -1.5L10.99 -0.94L16 2.43" fill="none" stroke="#9AA3BE" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M-2.4 -1.5L-10.88 3.08L-16 9.13" fill="none" stroke="#9AA3BE" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M2.4 -1.5L10.88 3.08L16 9.13" fill="none" stroke="#9AA3BE" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="0" cy="-4.6" rx="2.6" ry="3.1" fill="#9AA3BE"/>
    <ellipse cx="0" cy="3.4" rx="3.4" ry="6.2" fill="#9AA3BE"/>
  </g></g></g>
    </g>
  </g>
</svg>