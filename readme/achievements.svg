<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 880 384" width="880" height="384" role="img" aria-label="Achievements" preserveAspectRatio="xMidYMid meet">
<title>Achievements</title>
<desc>IEEE TechRush 26 Hackathon — Winner (1st Place). Frontend Development track. Won 1st place in a four-member team for Wanderly, an adaptive AI travel dashboard built end to end during the hackathon. BoardroomAI — AI board-of-directors hackathon build. Built an eight-agent AI executive panel that debates a founder’s pitch live, votes on it, and generates the full investment pack — SWOT, market research, financials, roadmap, PRD and pitch deck. Pictoreal Hackathon — CodeTheCause 2025-26. Participated as a member of team 'The Semicolon', building Sahay — a peer-learning matchmaking platform for NGO and college classrooms. Impetus and Concepts 2026. Participated in this international-level technical event organised by Pune Institute of Computer Technology.</desc>
<defs>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="0.4" y2="1">
    <stop offset="0" stop-color="#0C0F1B"/>
    <stop offset="0.55" stop-color="#0B0D16"/>
    <stop offset="1" stop-color="#06070E"/>
  </linearGradient>
  <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#E0475A"/>
    <stop offset="1" stop-color="#B5303F"/>
  </linearGradient>
  <linearGradient id="navyGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#4C63B6"/>
    <stop offset="1" stop-color="#172143"/>
  </linearGradient>
  <linearGradient id="edgeGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#B5303F" stop-opacity="0.9"/>
    <stop offset="0.5" stop-color="#33406B" stop-opacity="0.55"/>
    <stop offset="1" stop-color="#172143" stop-opacity="0.9"/>
  </linearGradient>
  <pattern id="halftone" width="6" height="6" patternUnits="userSpaceOnUse">
    <circle cx="1.5" cy="1.5" r="0.75" fill="#FFFFFF" fill-opacity="0.035"/>
    <circle cx="4.5" cy="4.5" r="0.75" fill="#FFFFFF" fill-opacity="0.02"/>
  </pattern>
  <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="3.2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="tinyGlow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="1.6" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter></defs>
