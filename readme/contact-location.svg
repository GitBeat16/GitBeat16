<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 430 49" width="430" height="49" role="img" aria-label="Pune, Maharashtra" preserveAspectRatio="xMidYMid meet">
<title>Pune, Maharashtra</title>
<defs>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="0.4" y2="1">
    <stop offset="0" stop-color="#0C0F1B"/>
    <stop offset="0.55" stop-color="#0B0D16"/>
    <stop offset="1" stop-color="#06070E"/>
  </linearGradient>
  <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#E0475A"/>
    <stop offset="1" stop-color="#B5303F"/>
  </linearGradient>
  <linearGradient id="navyGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#4C63B6"/>
    <stop offset="1" stop-color="#172143"/>
  </linearGradient>
  <linearGradient id="edgeGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#B5303F" stop-opacity="0.9"/>
    <stop offset="0.5" stop-color="#33406B" stop-opacity="0.55"/>
    <stop offset="1" stop-color="#172143" stop-opacity="0.9"/>
  </linearGradient>
  <pattern id="halftone" width="6" height="6" patternUnits="userSpaceOnUse">
    <circle cx="1.5" cy="1.5" r="0.75" fill="#FFFFFF" fill-opacity="0.035"/>
    <circle cx="4.5" cy="4.5" r="0.75" fill="#FFFFFF" fill-opacity="0.02"/>
  </pattern>
  <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="3.2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="tinyGlow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="1.6" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter></defs>
<style>
  text{font-family:'Segoe UI', 'Helvetica Neue', 'DejaVu Sans', Arial, sans-serif;dominant-baseline:middle}
  .d{font-family:'Trebuchet MS', 'Verdana', 'DejaVu Sans', sans-serif;font-weight:700;letter-spacing:0.5px}
  .mono{font-family:'SFMono-Regular', 'DejaVu Sans Mono', Menlo, Consolas, monospace}
  .t{fill:#ECE7E4}
  .dim{fill:#9AA3BE}
  .faint{fill:#5C6684}
  .red{fill:#E0475A}
  @media (prefers-reduced-motion: reduce){*{animation:none !important}}
@keyframes tileIn{0%{transform:translateY(11px) scale(.985)}100%{transform:translateY(0) scale(1)}}
.tile{animation:tileIn .55s ease-out;transform-box:fill-box}
  @keyframes nudge{0%,100%{transform:translate(0,0)}50%{transform:translate(2px,-2px)}}
  .go{animation:nudge 1.6s ease-in-out infinite;animation-delay:600ms}</style>
<g>
    <g opacity="1">
    <path d="M10 2H430V37L420 47H0V12Z" fill="#101426" stroke="#232B47" stroke-width="1.4"/>
    <path d="M10 2H430V37L420 47H0V12Z" fill="url(#halftone)"/>
    <path d="M10 2H430" stroke="#33406B" stroke-width="2.2" fill="none" opacity="0.9"/>
  </g>
    <rect x="12" y="9.5" width="30" height="30" rx="9" fill="#151B31" stroke="#232B47" stroke-width="1"/>
    <g transform="translate(27 24.5) scale(0.7083)">
    <path d="M0 10.5C-4.6 4.6 -7 1.6 -7 -1.6a7 7 0 0 1 14 0c0 3.2 -2.4 6.2 -7 12.1Z" fill="none" stroke="#33406B" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M0 -4.2a2.6 2.6 0 1 1 0 5.2 2.6 2.6 0 0 1 0-5.2Z" fill="none" stroke="#33406B" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" /></g>
    <text x="56" y="25" font-size="15" class="t">Pune, Maharashtra</text>
    <g class="go"><path d="M395 29.5 l9 -9 M397 20.5 h7 v7" stroke="#9AA3BE" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
  </g>
</svg>