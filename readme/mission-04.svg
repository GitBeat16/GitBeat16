<title>Streamlit Applications — StockZ Terminal · Sahay</title>
<desc>MISSION 04: Streamlit Applications, StockZ Terminal · Sahay. Built with Python, Streamlit, Plotly, pandas, NumPy. StockZ Terminal — a quantitative paper-trading dashboard that detects chart formations such as bullish engulfing and hammer over a 120-day window, simulates order execution with configurable per-trade risk, and reports win-rate statistics. Repository: https://github.com/GitBeat16/stockz1, https://github.com/GitBeat16/adaptive_learning_ngo.</desc>
