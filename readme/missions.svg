      <text x="324.49" y="116.5" font-size="11" class="t" text-anchor="middle">Tailwind CSS v4</text>
    </g><g class="chip" style="animation-delay:160ms">
      <rect x="385.12" y="104" width="130.02" height="24" rx="7" fill="#151B31" stroke="#33406B" stroke-width="1"/>
      <text x="450.13" y="116.5" font-size="11" class="t" text-anchor="middle">Supabase (Postgres)</text>
    </g><g class="chip" style="animation-delay:200ms">
      <rect x="523.14" y="104" width="104.17" height="24" rx="7" fill="#151B31" stroke="#33406B" stroke-width="1"/>
      <text x="575.23" y="116.5" font-size="11" class="t" text-anchor="middle">Framer Motion</text>
    </g>
      <text x="24" y="144" font-size="12" class="dim">Winning project, IEEE TechRush 26 Hackathon (Frontend Development track) — a travel planner that reshapes its theme, recommendations</text><text x="24" y="161" font-size="12" class="dim">and content around a six-question onboarding profile and the user’s own trip history.</text>
      <g class="tile" style="animation-delay:300ms">
              <text x="552" y="56" font-size="19" class="d" fill="#E0475A" text-anchor="end">~33.7k</text>
              <text x="552" y="75" font-size="10" class="faint" text-anchor="end">lines</text>
