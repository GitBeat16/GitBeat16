      <text x="24" y="34" font-size="11" class="d" fill="#5C6684" letter-spacing="2.4">MISSION 01</text>
      <text x="24" y="62" font-size="25" class="d t">Wanderly</text>
      <text x="24" y="84" font-size="12.5" class="dim">Adaptive AI Travel Dashboard</text>
      <g class="tile" style="animation-delay:220ms">
