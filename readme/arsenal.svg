<title>Spider Arsenal — languages, frameworks, databases, tools</title>
<desc>Languages: C, C++, Python, TypeScript, JavaScript. Frameworks &amp; Libraries: Next.js (App Router), React, React Native (Expo), FastAPI, Tailwind CSS, Framer Motion, Streamlit. Databases &amp; Backend: MongoDB, Supabase (PostgreSQL), REST APIs, JWT / session auth, OAuth 2.0. Tools &amp; Platforms: Git / GitHub, Vercel, Railway, Claude &amp; Groq APIs, Leaflet / d3-geo, Wix Studio. Spoken: English, Hindi, Marathi</desc>
