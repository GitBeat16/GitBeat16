    <path d="M6 -6.6h3.4v1.8a3.6 3.6 0 0 1 -3.4 3.6" fill="none" stroke="#FFF1EE" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M0 1.6v4.2" fill="none" stroke="#FFF1EE" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" />
