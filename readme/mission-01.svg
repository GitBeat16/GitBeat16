  <text x="20" y="82" font-size="13" class="dim">Adaptive AI travel dashboard that reshapes itself around</text><text x="20" y="101" font-size="13" class="dim">each traveller — won IEEE TechRush 26.</text>
  <g class="chip" style="animation-delay:0ms">
      <rect x="20" y="116" width="78" height="24" rx="7" fill="#151B31" stroke="#33406B" stroke-width="1"/>
