      <text x="141.09" y="128.5" font-size="11.5" class="t" text-anchor="middle">React 19</text>
    </g><g class="chip" style="animation-delay:80ms">
      <rect x="184.19" y="116" width="82.83" height="24" rx="7" fill="#151B31" stroke="#33406B" stroke-width="1"/>
