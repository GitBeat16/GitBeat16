    </g>
  <text x="394" y="154" font-size="11" class="faint mono" text-anchor="end">view repo</text>
  <g class="mArrow"><path d="M403 159 l8 -8 M405 151 h6 v6" stroke="#9AA3BE" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
