  <text x="20" y="28" font-size="11" class="mono red" letter-spacing="1.5">MISSION 03</text>
  <rect x="321.31" y="16" width="92.69" height="22" rx="11" fill="#172143" stroke="#2C3A6B" stroke-width="1"/>
       <text x="367.65" y="27.5" font-size="10" class="d" fill="#D7DEF8" text-anchor="middle" letter-spacing="1">IN PROGRESS</text>
  <text x="20" y="56" font-size="16" class="d t">Lumi</text>
  <text x="20" y="82" font-size="13" class="dim">Mobile AI companion with emotion detection, voice chat and</text><text x="20" y="101" font-size="13" class="dim">mood tracking.</text>
  <g class="chip" style="animation-delay:0ms">
      <rect x="20" y="116" width="130.1" height="24" rx="7" fill="#151B31" stroke="#4C63B6" stroke-width="1"/>
      <text x="85.05" y="128.5" font-size="11.5" class="t" text-anchor="middle">React Native (Expo)</text>
    </g><g class="chip" style="animation-delay:40ms">
      <rect x="158.1" y="116" width="82.83" height="24" rx="7" fill="#151B31" stroke="#4C63B6" stroke-width="1"/>
      <text x="199.51" y="128.5" font-size="11.5" class="t" text-anchor="middle">TypeScript</text>
    </g><g class="chip" style="animation-delay:80ms">
