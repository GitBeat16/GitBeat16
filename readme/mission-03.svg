<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 440 180" width="440" height="180" role="img" aria-label="Lumi — AI Companion App" preserveAspectRatio="xMidYMid meet">
<title>Lumi — AI Companion App</title>
<desc>MISSION 03: Lumi. Mobile AI companion with emotion detection, voice chat and mood tracking. Built with React Native (Expo), TypeScript, FastAPI, MongoDB.</desc>
<defs>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="0.4" y2="1">
    <stop offset="0" stop-color="#0C0F1B"/>
    <stop offset="0.55" stop-color="#0B0D16"/>
    <stop offset="1" stop-color="#06070E"/>
  </linearGradient>
  <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#E0475A"/>
    <stop offset="1" stop-color="#B5303F"/>
  </linearGradient>
  <linearGradient id="navyGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#4C63B6"/>
    <stop offset="1" stop-color="#172143"/>
  </linearGradient>
  <linearGradient id="edgeGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#B5303F" stop-opacity="0.9"/>
    <stop offset="0.5" stop-color="#33406B" stop-opacity="0.55"/>
    <stop offset="1" stop-color="#172143" stop-opacity="0.9"/>
  </linearGradient>
  <pattern id="halftone" width="6" height="6" patternUnits="userSpaceOnUse">
    <circle cx="1.5" cy="1.5" r="0.75" fill="#FFFFFF" fill-opacity="0.035"/>
    <circle cx="4.5" cy="4.5" r="0.75" fill="#FFFFFF" fill-opacity="0.02"/>
  </pattern>
  <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="3.2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="tinyGlow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="1.6" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter></defs>
<style>
  text{font-family:'Segoe UI', 'Helvetica Neue', 'DejaVu Sans', Arial, sans-serif;dominant-baseline:middle}
  .d{font-family:'Trebuchet MS', 'Verdana', 'DejaVu Sans', sans-serif;font-weight:700;letter-spacing:0.5px}
  .mono{font-family:'SFMono-Regular', 'DejaVu Sans Mono', Menlo, Consolas, monospace}
  .t{fill:#ECE7E4}
  .dim{fill:#9AA3BE}
  .faint{fill:#5C6684}
  .red{fill:#E0475A}
  @media (prefers-reduced-motion: reduce){*{animation:none !important}}
/* Motion is purely additive: no fill-mode, so before and after the animation
   the element renders at its base style. Content is never hidden by a delay,
   by an offscreen-throttled image, or by prefers-reduced-motion.
   (Never put a raw angle bracket in here: this stylesheet is inlined into XML.) */
@keyframes chipIn{0%{transform:translateY(7px) scale(.98)}100%{transform:translateY(0) scale(1)}}
.chip{transform-box:fill-box;transform-origin:50% 50%;animation:chipIn .5s ease-out}
  @keyframes mArrow{0%,100%{transform:translate(0,0)}50%{transform:translate(2px,-2px)}}
  .mArrow{animation:mArrow 1.4s ease-in-out infinite;animation-delay:0.6s}</style>
