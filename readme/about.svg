<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 880 320" width="880" height="320" role="img" aria-label="About" preserveAspectRatio="xMidYMid meet">
<title>About</title>
<desc>Second-year Computer Engineering student at PICT Pune. I build full-stack products with TypeScript, Next.js, React Native and FastAPI. Interested in AI/ML, open source, system design and developer tooling — curious about how things work beneath the abstraction. I learn by building, breaking, understanding and rebuilding. Currently turning ideas into software &gt;.&lt; B.E. Computer Engineering, PICT Pune (SPPU), Second Year (SE), Semester III. Based in Pune, Maharashtra. Speaks English, Hindi, Marathi. CGPA 9.44 / 10, SGPA Sem I 9.54 / 10, SGPA Sem II 9.29 / 10, MHT-CET 99.34 %ile, SSC 96.40 %, HSC 76.17 %.</desc>
