<svg viewBox="0 0 1000 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4C8CFF"/>
      <stop offset="100%" stop-color="#8ECBFF"/>
    </linearGradient>
    <pattern id="bricks" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#C84C0C"/>
      <rect width="40" height="18" fill="#E0651C"/>
      <rect width="40" height="40" fill="none" stroke="#7A2E00" stroke-width="2"/>
      <line x1="20" y1="0" x2="20" y2="18" stroke="#7A2E00" stroke-width="2"/>
      <line x1="0" y1="20" x2="40" y2="20" stroke="#7A2E00" stroke-width="2"/>
      <line x1="20" y1="20" x2="20" y2="40" stroke="#7A2E00" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="1000" height="260" fill="url(#sky)"/>

  <!-- clouds -->
  <g fill="#FFFFFF">
    <g transform="translate(70,50)"><ellipse cx="0" cy="15" rx="26" ry="13"/><ellipse cx="24" cy="8" rx="20" ry="15"/><ellipse cx="-22" cy="10" rx="18" ry="12"/></g>
    <g transform="translate(430,35)"><ellipse cx="0" cy="15" rx="30" ry="14"/><ellipse cx="28" cy="6" rx="22" ry="16"/><ellipse cx="-26" cy="10" rx="20" ry="13"/></g>
    <g transform="translate(820,55)"><ellipse cx="0" cy="15" rx="24" ry="12"/><ellipse cx="22" cy="8" rx="18" ry="13"/><ellipse cx="-20" cy="9" rx="16" ry="11"/></g>
  </g>

  <!-- castle -->
  <g transform="translate(30,120)">
    <rect x="0" y="30" width="90" height="90" fill="#B9BEC7" stroke="#5B6068" stroke-width="3"/>
    <rect x="-6" y="0" width="14" height="34" fill="#B9BEC7" stroke="#5B6068" stroke-width="3"/>
    <rect x="30" y="-14" width="14" height="48" fill="#B9BEC7" stroke="#5B6068" stroke-width="3"/>
    <rect x="82" y="0" width="14" height="34" fill="#B9BEC7" stroke="#5B6068" stroke-width="3"/>
    <circle cx="45" cy="80" r="12" fill="#5B6068"/>
    <rect x="14" y="55" width="16" height="16" fill="#5B6068"/>
    <rect x="60" y="55" width="16" height="16" fill="#5B6068"/>
  </g>

  <!-- HUD: coin counter -->
  <g transform="translate(28,22)" font-family="Trebuchet MS, Verdana, sans-serif" font-weight="700">
    <text x="0" y="14" fill="#FFFFFF" font-size="16" stroke="#1B1B2F" stroke-width="3" paint-order="stroke" letter-spacing="1">GITBEAT16</text>
    <circle cx="8" cy="34" r="9" fill="#FBD000" stroke="#7A5200" stroke-width="2"/>
    <text x="0" y="39" fill="#7A5200" font-size="11" text-anchor="middle" transform="translate(8,0)">*</text>
    <text x="24" y="39" fill="#FFFFFF" font-size="15" stroke="#1B1B2F" stroke-width="3" paint-order="stroke">x 22 REPOS</text>
  </g>

  <!-- HUD: health / level bar -->
  <g transform="translate(700,22)" font-family="Trebuchet MS, Verdana, sans-serif" font-weight="700">
    <text x="0" y="14" fill="#FFFFFF" font-size="14" stroke="#1B1B2F" stroke-width="3" paint-order="stroke">SECOND YEAR CS STUDENT</text>
    <rect x="0" y="24" width="220" height="16" rx="8" fill="#FFFFFF" stroke="#1B1B2F" stroke-width="3"/>
    <rect x="3" y="27" width="180" height="10" rx="5" fill="#E52521"/>
  </g>

  <!-- title -->
  <g font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="58" text-anchor="middle" paint-order="stroke" stroke="#1B1B2F" stroke-width="7" stroke-linejoin="round">
    <text x="360" y="140" fill="#E52521">W</text>
    <text x="410" y="140" fill="#FBD000">E</text>
    <text x="455" y="140" fill="#049CD8">L</text>
    <text x="500" y="140" fill="#43B047">C</text>
    <text x="550" y="140" fill="#E52521">O</text>
    <text x="605" y="140" fill="#FBD000">M</text>
    <text x="660" y="140" fill="#049CD8">E</text>
  </g>
  <text x="500" y="178" text-anchor="middle" font-family="Trebuchet MS, Verdana, sans-serif" font-weight="700" font-size="22" fill="#FFFFFF" stroke="#1B1B2F" stroke-width="4" paint-order="stroke">TO SRUSHTI'S WORLD</text>

  <!-- pipes with flowers -->
  <g transform="translate(150,150)">
    <rect x="-6" y="30" width="72" height="26" fill="#00A800" stroke="#004D00" stroke-width="4"/>
    <rect x="6" y="56" width="48" height="44" fill="#00C800" stroke="#004D00" stroke-width="4"/>
    <g transform="translate(30,20)">
      <rect x="-4" y="10" width="8" height="16" fill="#3C8C28"/>
      <circle cx="0" cy="4" r="12" fill="#E52521"/>
      <circle cx="-5" cy="1" r="3" fill="#FFFFFF"/>
      <circle cx="6" cy="2" r="3" fill="#FFFFFF"/>
    </g>
  </g>

  <g transform="translate(780,150)">
    <rect x="-6" y="30" width="72" height="26" fill="#00A800" stroke="#004D00" stroke-width="4"/>
    <rect x="6" y="56" width="48" height="44" fill="#00C800" stroke="#004D00" stroke-width="4"/>
    <g transform="translate(30,20)">
      <rect x="-4" y="10" width="8" height="16" fill="#3C8C28"/>
      <circle cx="0" cy="4" r="12" fill="#E52521"/>
      <circle cx="-5" cy="1" r="3" fill="#FFFFFF"/>
      <circle cx="6" cy="2" r="3" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- bushes -->
  <g fill="#2FA53A" stroke="#1B6B22" stroke-width="3">
    <g transform="translate(600,205)"><ellipse cx="0" cy="10" rx="26" ry="16"/><ellipse cx="24" cy="10" rx="22" ry="14"/><ellipse cx="-24" cy="10" rx="20" ry="13"/></g>
  </g>

  <!-- ground -->
  <rect x="0" y="220" width="1000" height="40" fill="url(#bricks)"/>
</svg>
